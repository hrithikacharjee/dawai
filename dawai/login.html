<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawai - Login</title>
    <link rel="icon" href="assets/Asset 5@3x.png">
    <link rel="stylesheet" href="css/auth.css">
    <script src="https://kit.fontawesome.com/c0adbb8084.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .auth-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .new-user-btn {
            background: none;
            border: none;
            color: #07a1a1;
            cursor: pointer;
            font-weight: 600;
            padding: 10px 15px;
        }
        .new-user-btn:hover {
            text-decoration: underline;
        }
        .back-to-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #07a1a1;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-to-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="auth-container">
        <div class="auth-form">
            <img src="assets/Asset 5@3x.png" alt="Dawai Logo" style="height: 60px; margin-bottom: 20px; display: block; margin-left: auto; margin-right: auto;">
            <h2>Welcome Back</h2>
            <form id="loginForm">
                <!-- Email Field -->
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" name="email" required>
                    <!-- Added name="email" -->
                </div>
                
                <!-- Password Field -->
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" required>
                    <!-- Added name="password" -->
                </div>
                
                <button type="submit" class="auth-btn">Login</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Add your login logic here
            console.log('Login submitted');
            window.location.href = 'index.html'; // Redirect after login
        });
    </script>
</body>
</html>
